        \ Existing settings and packaging checks\n+are retained. See VALIDATION.txt for the exact completed checks.\n\
        +\n+The corrected full Android/Vulkan compilation, CPU-writable hardware-buffer\n+allocation on this phone,\
        \ display output, game shaders and performance still\n+require the workflow and device run. Host tests do\
        \ not emulate Android's\n+compositor or prove Vulkan synchronization. This is not a confirmed visual fix.\n\
