# Experimental Mali/PanVK renderer, Test 3: CPU display compatibility path.
# Test2 passed buffer/wave64 probes and sent frames; its displayed scene remained black.
# Fixes environment readback overrides; bypasses Vulkan import of display AHBs.
# Adds bounded pre/post-process pixel checks and a brief RGB display-route marker.
# Upload as .github/workflows/phone-mali.yml on your fork's default android branch.
# Start a NEW "GOW3 Mali PanVK experimental build (Test 3)" run after committing it.
# Downloads upstream v2.1.7-bionic-v1 and applies its complete embedded patch.
# Success artifact: GOW3-Mali-PanVK-test3-apk. Install GOW3-Mali-PanVK-test3.apk.
# Separate app: God of War III Mali Test 3 / com.gow3.android.bionic.malitest3.
# Failure artifact: GOW3-Mali-PanVK-build-logs. No signing secrets needed.
# The fallback is automatic when sparse buffer features/queue are unavailable.
# Retains the previous unmapped-submodule, Linux and SDK 36 build fixes.
name: GOW3 Mali PanVK experimental build (Test 3)
'on':
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    env:
      GOW3_JOBS: '2'
      GOW3_ANDROID_API: '30'
      GOW3_BUILD_TOOLS: 36.0.0
    steps:
    - name: Get the matching upstream source without automatic submodules
      run: |
        git clone --depth 1 --single-branch --branch v2.1.7-bionic-v1                   --no-recurse-submodules https://github.com/zFitness/gow3_android.git .
    - name: Record the source version
      run: |
        mkdir -p out/phone-build
        git rev-parse HEAD > out/phone-build/source-commit.txt
        git config -f .gitmodules --get-regexp '^submodule\..*\.url$'                   > out/phone-build/submodule-urls.txt
    - name: Skip unmapped gitlinks and fetch the build submodules
      run: |
        python3 - <<'PY'
        from pathlib import Path
        import subprocess
        result = subprocess.run(
            ['git', 'config', '-f', '.gitmodules', '--get-regexp',
             r'^submodule\..*\.path$'],
            check=True, capture_output=True, text=True)
        declared = {line.split(None, 1)[1] for line in result.stdout.splitlines()}
        entries = subprocess.check_output(['git', 'ls-files', '--stage', '-z'])
        skipped = []
        for entry in entries.split(b'\0'):
            if not entry:
                continue
            metadata, raw_path = entry.split(b'\t', 1)
            path = raw_path.decode('utf-8')
            if metadata.split()[0] == b'160000' and path not in declared:
                # Only the temporary runner's index is changed. No commit,
                # push, or deletion of files in the user's fork is performed.
                subprocess.run(['git', 'update-index', '--force-remove', '--', path],
                               check=True)
                skipped.append(path)
        Path('out/phone-build/skipped-gitlinks.txt').write_text(
            ''.join(path + '\n' for path in skipped))
        print('Skipped gitlinks without .gitmodules mappings:', skipped)
        PY

        # Restrict both update and status to the seven build dependencies.
        modules=(
          third_party/FEX
          third_party/LibAtrac9
          gpu/third_party/fsr-vulkan
          gpu/third_party/imgui
          gpu/third_party/magic_enum
          gpu/third_party/miniz
          gpu/third_party/xbyak
        )
        git submodule update --init --recursive -- "${modules[@]}"                   2>&1 | tee out/phone-build/submodule-checkout.log
        git submodule status --recursive -- "${modules[@]}"                   > out/phone-build/submodules.txt
    - name: Set up Java
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: '17'
    - name: Install native build tools
      run: |
        sudo apt-get update
        sudo apt-get install --yes --no-install-recommends                   build-essential clang lld llvm cmake ninja-build pkg-config                   git curl unzip xz-utils zlib1g-dev libzstd-dev libssl-dev                   glslang-tools spirv-tools bison flex nasm autoconf automake libtool
    - name: Set up the pinned Android tools
      uses: android-actions/setup-android@v4
      with:
        packages: platform-tools platforms;android-36 build-tools;36.0.0 ndk;29.0.14206865
        log-accepted-android-sdk-licenses: 'false'
    - name: Configure the SDK and NDK locations
      run: |
        sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
        test -n "$sdk"
        test -f "$sdk/platforms/android-36/android.jar"
        test -x "$sdk/build-tools/36.0.0/apksigner"
        test -f "$sdk/ndk/29.0.14206865/build/cmake/android.toolchain.cmake"
        {
          echo "ANDROID_HOME=$sdk"
          echo "ANDROID_SDK_ROOT=$sdk"
          echo "GOW3_ANDROID_SDK=$sdk"
          echo "GOW3_NDK=$sdk/ndk/29.0.14206865"
        } >> "$GITHUB_ENV"
    - name: Apply Mali buffer backend and run host and shader checks
      run: "python3 - <<'PY'\nimport hashlib\nfrom pathlib import Path\npatch = r'''--- a/.github/workflows/android.yml\n\
        +++ b/.github/workflows/android.yml\n@@ -41,6 +41,28 @@\n           python -m unittest \\\n            \
        \ discover -s tests -p 'test_android_*.py'\n           python -m py_compile tools/android/*.py\n+\n+   \
        \   - name: Check GPU initialization error handling\n+        run: |\n+          c++ -std=c++23 -O2 -DNDEBUG\
        \ -Wall -Wextra -Werror -I gpu/shim \\\n+            tests/test_gpu_init_guard.cpp -o \"$RUNNER_TEMP/test_gpu_init_guard\"\
        \n+          \"$RUNNER_TEMP/test_gpu_init_guard\"\n+\n+      - name: Check ordinary buffer range migration\
        \ and snapshot copies\n+        run: |\n+          c++ -std=c++23 -O2 -DNDEBUG -Wall -Wextra -Werror -I\
        \ gpu/shadps4 \\\n+            tests/test_dense_buffer_map.cpp -o \"$RUNNER_TEMP/test_dense_buffer_map\"\
        \n+          \"$RUNNER_TEMP/test_dense_buffer_map\"\n+\n+      - name: Check wave64 guest layout and diagnostic\
        \ settings\n+        run: |\n+          c++ -std=c++23 -O2 -DNDEBUG -Wall -Wextra -Werror -I gpu/shadps4\
        \ \\\n+            tests/test_wave64_layout.cpp -o \"$RUNNER_TEMP/test_wave64_layout\"\n+          \"$RUNNER_TEMP/test_wave64_layout\"\
        \n+          c++ -std=c++23 -O2 -UNDEBUG -Wall -Wextra -Werror -I gpu/shim \\\n+            tests/test_graphics_settings.cpp\
        \ gpu/shim/gow3_settings.cpp \\\n+            -o \"$RUNNER_TEMP/test_graphics_settings\"\n+          \"\
        $RUNNER_TEMP/test_graphics_settings\"\n \n   release:\n     name: Build signed Android release\n--- /dev/null\n\
        +++ b/BLACK-SCREEN-ANALYSIS.txt\n@@ -0,0 +1,30 @@\n+Observed evidence from GodOfWar3-Logs-20261018-112702.zip\n\
        +\n+Phone: OPPO CPH2737 / Android 16 / Mali-G615 MC6 / PanVK-kbase\n+App: 2.1.7-bionic-v1-mali-test1\n+\n\
        +Confirmed:\n+- dense experimental buffer backend selected\n+- GOW3_MALI_DENSE_BUFFER_PROBE=PASS\n+- presentation\
        \ connection established, 3 buffers at 1280x720\n+- game modules initialize and game data loads\n+- FSR\
        \ 3.1 and deferred/stale readbacks enabled\n+- no recorded fatal Vulkan error or shader compilation failure\n\
        +\n+Not established:\n+- the exact cause of the reported black screen and white artifacts\n+- whether the\
        \ main scene is submitting correct draws or merely loading\n+- correctness of translated compute/graphics\
        \ shaders, images or displayed pixels\n+- FPS, thermal behavior or sustained gameplay\n+\n+Source defects\
        \ addressed in the next experimental build:\n+- hard-coded 32-lane assumptions in logical wave64 emulation\n\
