        \ policy on smaller/non-fixed subgroups\n+- storage-buffer visibility for emulated LDS and accounting for\
        \ native scratch\n+- shader cache invalidation after lowering changes\n+\n+Test 2 adds a mapping-independent\
        \ shared-memory fallback, a real-driver 8x16\n+primitive probe, conservative startup settings and frame-path\
        \ diagnostics.\n+This is a candidate rendering correction and investigation build, not a\n+confirmed black-screen\
        \ fix. Read MALI-PANVK-TEST.md for testing instructions.\n--- /dev/null\n+++ b/MALI-PANVK-TEST.md\n@@ -0,0\
        \ +1,89 @@\n+# Mali / PanVK Test 3: display compatibility investigation\n+\n+Target: OPPO Reno14 / CPH2737,\
        \ Android 16, Mali-G615 MC6 and the imported\n+PanVK-kbase driver. This remains an experimental port. A\
        \ working game image,\n+full gameplay compatibility and performance have not been established.\n+\n+## Evidence\
        \ from the Test 2 phone logs\n+\n+The 13:13 export identifies app 2.1.7-bionic-v1-mali-test2 (3). Both the\
        \ dense\n+buffer and wave64 GPU probes PASS on subgroup size 16. The current run reaches\n+1,440 submitted\
        \ game frames, 660,963 recorded draws and 1,427 dispatches. No\n+fatal Vulkan error is recorded. These counts\
        \ show continued submission and\n+progress; they do not establish visible game pixels or correct shading.\n\
        +\n+The log also exposes a concrete configuration bug: despite the settings message\n+claiming synchronous\
        \ readbacks, the texture cache enables deferred/stale copies.\n+It reads environment variables directly,\
        \ whereas Test 2 only overrode the\n+settings object. Test 3 applies the effective environment overrides\
        \ after the\n+derived launch settings and local overrides, before starting the game process.\n+It also disables\
        \ the reduced-resolution session while temporal upscaling is off.\n+\n+## Display compatibility path\n+\n\
        +Test 3 renders the final image into an ordinary Vulkan RGBA8 image, copies it to\n+host-visible memory,\
        \ waits for GPU completion, and copies it into a CPU-writable\n+Android hardware buffer. The custom Vulkan\
        \ driver no longer imports the display\n+hardware buffer. Android's own compositor consumes that buffer\
        \ as before.\n+\n+The copy respects Android's row stride, makes output opaque, waits for release\n+fences\
        \ before buffer reuse, and forwards the unlock fence to the app. The first\n+use of each ordinary Vulkan\
        \ image starts from Undefined layout. The existing\n+direct display path remains available through GOW3_AHB_CPU_COPY=0\
        \ when starting\n+the native process manually; the supplied Test 3 launcher selects CPU_COPY.\n+\n+This\
        \ bypasses one possible driver/display interoperability failure. The Test 2\n+log does not prove that interoperability\
        \ caused its black output. A GPU image\n+that is already black still needs shader, texture or render-target\
        \ investigation.\n+The copy adds memory traffic and CPU work; no speed improvement is claimed.\n+\n+## Pixel\
        \ diagnostics\n+\n+A thin red/green/blue strip is inserted at the top for the first 120 presented\n+frames.\
        \ It is a temporary display-route check, not game graphics. Pixel statistics\n+are collected before the\
        \ strip is added. Its appearance confirms that Android\n+can show the fallback's buffers; it does not prove\
        \ game rendering is correct.\n+\n+The log records GOW3_MALI_PIXELS for the guest display image and post-processed\n\
        +output at game frames 30, 120 and 600, plus sampled final presentation images.\n+RGBA8/BGRA8 statistics\
        \ report RGB nonblack counts, opaque alpha counts and a\n+checksum. Other formats are explicitly reported\
