    - name: Check launcher SDK and library compatibility before the native build
      run: |
        # This checks AAR metadata without staging the not-yet-built runtime.
        # The actual APK build later runs the staging task normally.
        bash android-launcher/gradlew -p android-launcher                   :app:checkDebugAarMetadata --exclude-task :app:stageDebugRuntime                   --no-daemon --no-configuration-cache --stacktrace                   2>&1 | tee out/phone-build/launcher-check.log
    - name: Install the host header dependencies
      run: |
        prefix="$PWD/.local-deps/root/usr"
        sources="$PWD/.local-deps/phone-sources"
        mkdir -p "$prefix" "$sources"

        curl --fail --location --retry 3       https://github.com/boostorg/boost/releases/download/boost-1.87.0/boost-1.87.0-cmake.tar.xz       --output "$sources/boost.tar.xz"
        tar -xf "$sources/boost.tar.xz" -C "$sources"
        cmake -S "$sources/boost-1.87.0" -B "$sources/boost-build" -G Ninja       -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$prefix"       -DCMAKE_INSTALL_LIBDIR=lib -DBUILD_TESTING=OFF       '-DBOOST_INCLUDE_LIBRARIES=asio;container;intrusive;icl;pool;container_hash;preprocessor;headers'
        cmake --build "$sources/boost-build" --parallel 2
        cmake --install "$sources/boost-build"

        git clone --depth 1 --branch v1.3.0 https://github.com/Tessil/robin-map.git "$sources/robin-map"
        cmake -S "$sources/robin-map" -B "$sources/robin-build" -G Ninja       -DCMAKE_INSTALL_PREFIX="$prefix" -DBUILD_TESTING=OFF
        cmake --install "$sources/robin-build"

        git clone --depth 1 --branch v3.3.0       https://github.com/GPUOpen-LibrariesAndSDKs/VulkanMemoryAllocator.git "$sources/vma"
        cmake -S "$sources/vma" -B "$sources/vma-build" -G Ninja       -DCMAKE_INSTALL_PREFIX="$prefix" -DVMA_BUILD_SAMPLES=OFF
        cmake --install "$sources/vma-build"

        python3 - <<'PY'
        from pathlib import Path
        import os
        prefix = Path('.local-deps/root/usr').resolve()
        boost = list(prefix.glob('lib/cmake/Boost-*/BoostConfig.cmake'))
        if len(boost) != 1:
            raise SystemExit(f'Expected one installed BoostConfig.cmake, found {boost}')
        values = {'GOW3_ARM64_HEADERS': str(prefix), 'GOW3_BOOST_DIR': str(boost[0].parent)}
        headers = list(prefix.glob('lib/cmake/boost_headers-*/boost_headers-config.cmake'))
        if len(headers) == 1:
            values['GOW3_BOOST_HEADERS_DIR'] = str(headers[0].parent)
        with open(os.environ['GITHUB_ENV'], 'a') as env:
            for name, value in values.items():
                env.write(f'{name}={value}\n')
        print('Header package locations:', values)
        PY
    - name: Build Bionic dependencies
      run: |
        bash tools/android/build_bionic_deps.sh 2>&1 | tee out/phone-build/dependencies.log
    - name: Build the CPU and GPU runtime
      run: |
        bash tools/android/build_bionic.sh 2>&1 | tee out/phone-build/runtime-build.log
    - name: Build and verify the debug APK
      run: |
        bash tools/android/debug/build_bionic_debug_apk.sh 2>&1 | tee out/phone-build/apk-build.log
        python3 - <<'PY'
        from pathlib import Path
        import hashlib
        import shutil
        apks = list(Path('out/debug').glob('*.apk'))
        if len(apks) != 1:
            raise SystemExit(f'Expected exactly one newly built APK, found {apks}')
        output = Path('out/phone-build/apk/GOW3-Mali-PanVK-test3.apk')
        output.parent.mkdir(parents=True, exist_ok=True)
        shutil.copy2(apks[0], output)
        digest = hashlib.sha256(output.read_bytes()).hexdigest()
        output.with_suffix('.apk.sha256').write_text(f'{digest}  {output.name}\n')
        print('Built:', output, 'SHA-256:', digest)
        PY
    - name: Save the APK and checksum
      uses: actions/upload-artifact@v7
      with:
        name: GOW3-Mali-PanVK-test3-apk
        path: out/phone-build/apk/
        if-no-files-found: error
        retention-days: 7
    - name: Save diagnostics, including on failure
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: GOW3-Mali-PanVK-build-logs
        path: |
          out/phone-build/*.txt
          out/phone-build/*.log
          out/bionic/*-build.log
          .local-deps/android/bionic-build/*.log
          out/phone-build/*.patch
        include-hidden-files: true
        if-no-files-found: warn
        retention-days: 7
