        \ output\n+sample precedes that overlay. Automatic sampling does not write raw image files.\n+\n+The latest\
        \ app receive counter, child liveness and surface dimensions/validity\n+are also saved in logs/android-display.log\
        \ and included by Export Logs. This\n+preserves the app-side snapshot when logcat has already rotated.\n\
        +\n+## Build and test using Android\n+\n+1. Replace .github/workflows/phone-mali.yml on your fork's default\
        \ android branch\n+   with the accompanying phone-mali.yml and commit it.\n+2. Start a new Actions run:\
        \ GOW3 Mali PanVK experimental build (Test 3).\n+3. Download artifact GOW3-Mali-PanVK-test3-apk, unzip it\
        \ and install\n+   GOW3-Mali-PanVK-test3.apk.\n+4. Open God of War III Mali Test 3 (com.gow3.android.bionic.malitest3).\
        \ It is a\n+   separate app. Select the game directory and import/select the same PanVK\n+   driver. Keep\
        \ the existing test apps available for comparison.\n+5. Watch the first few seconds for the thin RGB strip.\
        \ Let the game run for\n+   about 60 seconds if responsive, then stop and use About -> Export Logs.\n+6.\
        \ Send the complete exported ZIP. Report separately whether the RGB strip,\n+   FPS/menu overlay, and actual\
        \ game image appeared. A screenshot or short\n+   recording helps distinguish those observations.\n+\n+The\
        \ workflow contains the full patch against upstream v2.1.7-bionic-v1. Only the\n+workflow must be uploaded\
        \ to build it; the source ZIP is supplied for review.\n+On build failure, download GOW3-Mali-PanVK-build-logs.\
        \ Keep phone-debug.yml as\n+an earlier backup. No replacement GPU driver is included.\n+\n+## Validation\
        \ limits\n+\n+Host tests exercise the production RGBA copy and analysis helpers with random\n+row padding,\
