# Experimental build recipe; no cloud build has been run or verified.
# From Android: use Chrome desktop mode and fork zFitness/gow3_android.
# In your fork, open .github/workflows and upload this file as phone-debug.yml.
# Commit to the default branch. Enable Actions, select this workflow, and Run workflow.
# This recipe downloads upstream v2.1.7-bionic-v1 and applies the startup fix itself.
# You do not need to upload the source ZIP or provide signing secrets.
# Success artifact: GOW3-startup-fix-debug-apk. Failure logs: GOW3-phone-build-logs.
# This fixes initialization handling only; Mali gameplay support remains unimplemented.
# The debug APK uses a different signing key from the installed upstream release.
name: GOW3 phone debug build (experimental)
'on':
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    env:
      GOW3_JOBS: '2'
      GOW3_ANDROID_API: '30'
      GOW3_BUILD_TOOLS: 35.0.0
    steps:
    - name: Get the matching upstream source and pinned submodules
      uses: actions/checkout@v7
      with:
        repository: zFitness/gow3_android
        ref: v2.1.7-bionic-v1
        submodules: recursive
        persist-credentials: false
    - name: Record the source version
      run: |
        mkdir -p out/phone-build
        git rev-parse HEAD > out/phone-build/source-commit.txt
        git submodule status --recursive > out/phone-build/submodules.txt
    - name: Set up Java
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: '17'
    - name: Install native build tools
      run: |
        sudo apt-get update
        sudo apt-get install --yes --no-install-recommends                   build-essential clang lld llvm cmake ninja-build pkg-config                   git curl unzip xz-utils zlib1g-dev libzstd-dev libssl-dev                   glslang-tools bison flex nasm autoconf automake libtool
    - name: Set up the pinned Android tools
      uses: android-actions/setup-android@v4
      with:
        packages: platform-tools platforms;android-37 build-tools;35.0.0 ndk;29.0.14206865
    - name: Configure the SDK and NDK locations
      run: |
        sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
        test -n "$sdk"
        test -f "$sdk/ndk/29.0.14206865/build/cmake/android.toolchain.cmake"
        {
          echo "ANDROID_HOME=$sdk"
          echo "ANDROID_SDK_ROOT=$sdk"
          echo "GOW3_ANDROID_SDK=$sdk"
          echo "GOW3_NDK=$sdk/ndk/29.0.14206865"
        } >> "$GITHUB_ENV"
    - name: Apply the startup fix and Linux build adjustments
      run: "python3 - <<'PY'\nimport hashlib\nfrom pathlib import Path\npatch = r'''--- a/gpu/shadps4/video_core/renderer_vulkan/vk_instance.cpp\n\
        +++ b/gpu/shadps4/video_core/renderer_vulkan/vk_instance.cpp\n@@ -4,6 +4,7 @@\n #include <boost/container/static_vector.hpp>\n\
        \ #include <fmt/format.h>\n #include <fmt/ranges.h>\n+#include <stdexcept>\n \n #include \"common/assert.h\"\
        \n #include \"common/debug.h\"\n@@ -179,7 +180,11 @@\n                VK_VERSION_MAJOR(TargetVulkanApiVersion),\
        \ VK_VERSION_MINOR(TargetVulkanApiVersion),\n                VK_VERSION_MAJOR(properties.apiVersion), VK_VERSION_MINOR(properties.apiVersion));\n\
        \ \n-    CreateDevice();\n+    // A failed CreateDevice leaves device null. Do not construct the scheduler\
        \ or\n+    // its semaphores with that handle; the C entry point reports this exception.\n+    if (!CreateDevice())\
        \ {\n+        throw std::runtime_error(\"Vulkan device initialization failed; see GPU errors above\");\n\
        +    }\n     CollectPhysicalMemoryInfo();\n     CollectImageFormatInfo();\n     CollectToolingInfo();\n\
        @@ -411,6 +416,19 @@\n     const bool calibrated_timestamps =\n         TRACY_GPU_ENABLED ? add_extension(VK_EXT_CALIBRATED_TIMESTAMPS_EXTENSION_NAME)\
        \ : false;\n \n+    // The arena buffers use both SPARSE_BINDING and SPARSE_RESIDENCY. A queue\n+    //\
        \ flag alone does not imply support for either of these device features.\n+    if (!features.sparseBinding\
        \ || !features.sparseResidencyBuffer) {\n+        LOG_CRITICAL(Render_Vulkan,\n+                     \"\
        This renderer requires sparseBinding and sparseResidencyBuffer \"\n+                     \"(reported: sparseBinding={},\
        \ sparseResidencyBuffer={}). \"\n+                     \"The selected driver cannot provide the sparse buffer\
        \ cache; \"\n+                     \"a renderer implementation without sparse binding is required.\",\n\
        +                     static_cast<bool>(features.sparseBinding),\n+                     static_cast<bool>(features.sparseResidencyBuffer));\n\
        +        return false;\n+    }\n+\n     const auto family_properties = physical_device.getQueueFamilyProperties();\n\
        \     if (family_properties.empty()) {\n         LOG_CRITICAL(Render_Vulkan, \"Physical device reported\
        \ no queues.\");\n@@ -420,7 +438,8 @@\n     bool graphics_queue_found = false;\n     for (std::size_t i\
        \ = 0; i < family_properties.size(); i++) {\n         const u32 index = static_cast<u32>(i);\n-        if\
        \ (family_properties[i].queueFlags & vk::QueueFlagBits::eGraphics) {\n+        if (family_properties[i].queueCount\
        \ &&\n+            (family_properties[i].queueFlags & vk::QueueFlagBits::eGraphics)) {\n             queue_family_index\
        \ = index;\n             graphics_queue_found = true;\n         }\n--- a/gpu/shadps4/video_core/renderer_vulkan/vk_instance.h\n\
        +++ b/gpu/shadps4/video_core/renderer_vulkan/vk_instance.h\n@@ -517,7 +517,7 @@\n private:\n     Instance(const\
        \ Frontend::WindowSystemInfo&, s32, bool, bool);\n     /// Creates the logical device opportunistically\
        \ enabling extensions\n-    bool CreateDevice();\n+    [[nodiscard]] bool CreateDevice();\n \n     /// Creates\
        \ the VMA allocator handle\n     void CreateAllocator();\n--- a/gpu/shim/gow3gpu.cpp\n+++ b/gpu/shim/gow3gpu.cpp\n\
        @@ -4,6 +4,7 @@\n #include \"gow3_png.h\"\n #include \"gow3_settings.h\"\n #include \"gow3_copy.h\"\n+#include\
        \ \"gow3_gpu_init_guard.h\"\n #ifndef _WIN32\n #include <sys/resource.h>\n #endif\n@@ -227,7 +228,7 @@\n\
        \ }\n #endif\n \n-extern \"C\" int gow3gpu_init(const Gow3GpuConfig* config) {\n+static int InitializeGpu(const\
        \ Gow3GpuConfig* config) {\n     // native 移植标志：用于确认设备运行的是包含 081df6f 修复的 GPU 库。\n     std::printf(\"GOW3_NATIVE_FIX_081DF6F=active\\\
        n\");\n     // native 移植标志：用于确认设备运行的是包含 195c7ab 修复的 GPU 库。\n@@ -280,6 +281,10 @@\n     return 0;\n }\n \n\
        +extern \"C\" int gow3gpu_init(const Gow3GpuConfig* config) {\n+    return Gow3Gpu::GuardInitialization([&]\
        \ { return InitializeGpu(config); });\n+}\n+\n namespace Libraries::Kernel { void StartKernelService();\
        \ }\n extern \"C\" void gow3gpu_register_kernel(void) {\n     Libraries::Kernel::StartKernelService();\n\
        --- /dev/null\n+++ b/gpu/shim/gow3_gpu_init_guard.h\n@@ -0,0 +1,27 @@\n+// SPDX-License-Identifier: GPL-2.0-or-later\n\
        +#pragma once\n+\n+#include <cstdio>\n+#include <exception>\n+#include <utility>\n+\n+namespace Gow3Gpu\
        \ {\n+\n+// The C loader checks for a nonzero result. C++ initialization failures must\n+// become that\
        \ result instead of unwinding across the C loader's entry point.\n+template <typename Initialize>\n+int\
        \ GuardInitialization(Initialize&& initialize) noexcept {\n+    try {\n+        return std::forward<Initialize>(initialize)();\n\
        +    } catch (const std::exception& error) {\n+        std::fprintf(stderr, \"GPU initialization failed:\
        \ %s\\n\", error.what());\n+    } catch (...) {\n+        std::fputs(\"GPU initialization failed: unknown\
        \ C++ exception\\n\", stderr);\n+    }\n+    // Keep the preceding Vulkan error and this failure visible\
        \ in exported logs.\n+    std::fflush(stdout);\n+    std::fflush(stderr);\n+    return -1;\n+}\n+\n+} //\
        \ namespace Gow3Gpu\n--- /dev/null\n+++ b/tests/test_gpu_init_guard.cpp\n@@ -0,0 +1,48 @@\n+// SPDX-License-Identifier:\
        \ GPL-2.0-or-later\n+// Host regression test; no Vulkan device, game files, or Android SDK required.\n+#include\
        \ <cstdio>\n+#include <memory>\n+#include <stdexcept>\n+\n+#include \"gow3_gpu_init_guard.h\"\n+\n+static\
        \ void Require(bool condition, const char* message) {\n+    if (!condition) {\n+        throw std::runtime_error(message);\n\
        +    }\n+}\n+\n+int main() {\n+    int calls = 0;\n+    Require(Gow3Gpu::GuardInitialization([&] {\n+  \
        \              ++calls;\n+                return 0;\n+            }) == 0,\n+            \"successful initialization\
        \ must return success\");\n+    Require(calls == 1, \"initialization must run exactly once\");\n+    Require(Gow3Gpu::GuardInitialization([]\
        \ { return 7; }) == 7,\n+            \"explicit initialization failure must be preserved\");\n+\n+    bool\
        \ unwound = false;\n+    bool continued = false;\n+    struct PendingResource {\n+        explicit PendingResource(bool&\
        \ released_) : released{released_} {}\n+        bool& released;\n+        ~PendingResource() { released\
        \ = true; }\n+    };\n+    // Throw with a non-copyable resource in scope: failure must unwind the\n+  \
        \  // partially initialized object, skip subsequent setup, and return to C.\n+    Require(Gow3Gpu::GuardInitialization([&]()\
        \ -> int {\n+                auto resource = std::make_unique<PendingResource>(unwound);\n+            \
        \    throw std::runtime_error(\"test: Vulkan device initialization failed\");\n+                continued\
        \ = true;\n+                return 0;\n+            }) == -1,\n+            \"device initialization exception\
        \ must become failure\");\n+    Require(unwound, \"partial initialization resources must be released\");\n\
        +    Require(!continued, \"setup must stop after failed initialization\");\n+\n+    Require(Gow3Gpu::GuardInitialization([]()\
        \ -> int { throw 42; }) == -1,\n+            \"unknown C++ exceptions must not escape the C entry point\"\
        );\n+    std::puts(\"GPU initialization guard: all checks passed\");\n+}\n'''\ndata = patch.encode('utf-8')\n\
        assert hashlib.sha256(data).hexdigest() == '04c2175dbb2af294374e162ef17204b13cab88f44e124ed161be224d6097fb38'\n\
        Path('out/phone-build/startup-fix.patch').write_bytes(data)\nPY\ngit apply --check out/phone-build/startup-fix.patch\n\
        git apply out/phone-build/startup-fix.patch\npython3 - <<'PY'\nfrom pathlib import Path\n\ndef edit(path,\
        \ old, new):\n    path = Path(path)\n    text = path.read_text()\n    if text.count(old) != 1:\n       \
        \ raise SystemExit(f'Expected exactly one matching section in {path}; source differs')\n    path.write_text(text.replace(old,\
        \ new, 1))\n\nedit('tools/android/build_jni_libs.sh',\n     'bin=$ndk/toolchains/llvm/prebuilt/darwin-x86_64/bin',\n\
        \     'bin=$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin')\n\n# The original CPU affinity assumes cores\
        \ 2..23, which a small runner may not have.\nfor path in ('tools/android/build_bionic.sh', 'tools/android/build_bionic_deps.sh'):\n\
        \    edit(path, 'taskset -c 2-23 nice -n 19', 'nice -n 19')\n\n# A clean build has no old probe to inspect\
        \ for its SDL dependency. The new\n# probe links SDL3, so stage that runtime library explicitly on the first\
        \ build.\nedit('tools/android/build_bionic.sh',\n     'cp -f \"$llvm/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so\"\
        \ \"$out/lib/\"',\n     'cp -f \"$llvm/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so\" \"$out/lib/\"\
        \\n'\n     'cp -f \"$prefix/lib/libSDL3.so\" \"$out/lib/\"')\nprint('Applied Linux runner and first-build\
        \ staging adjustments')\nPY\ngit diff --check\ngit diff --stat\nbash -n tools/android/build_jni_libs.sh\
        \ tools/android/build_bionic.sh tools/android/build_bionic_deps.sh\ng++ -std=c++23 -O2 -DNDEBUG -Wall -Wextra\
        \ -Werror -I gpu/shim tests/test_gpu_init_guard.cpp -o out/phone-build/test_gpu_init_guard\nout/phone-build/test_gpu_init_guard\n"
    - name: Install the host header dependencies
      run: |
        prefix="$PWD/.local-deps/root/usr"
        sources="$PWD/.local-deps/phone-sources"
        mkdir -p "$prefix" "$sources"

        curl --fail --location --retry 3       https://github.com/boostorg/boost/releases/download/boost-1.87.0/boost-1.87.0-cmake.tar.xz       --output "$sources/boost.tar.xz"
        tar -xf "$sources/boost.tar.xz" -C "$sources"
        cmake -S "$sources/boost-1.87.0" -B "$sources/boost-build" -G Ninja       -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$prefix"       -DCMAKE_INSTALL_LIBDIR=lib -DBUILD_TESTING=OFF       '-DBOOST_INCLUDE_LIBRARIES=asio;container;intrusive;icl;pool;container_hash;preprocessor;headers'
        cmake --build "$sources/boost-build" --parallel 2
        cmake --install "$sources/boost-build"

        git clone --depth 1 --branch v1.3.0 https://github.com/Tessil/robin-map.git "$sources/robin-map"
        cmake -S "$sources/robin-map" -B "$sources/robin-build" -G Ninja       -DCMAKE_INSTALL_PREFIX="$prefix" -DBUILD_TESTING=OFF
        cmake --install "$sources/robin-build"

        git clone --depth 1 --branch v3.3.0       https://github.com/GPUOpen-LibrariesAndSDKs/VulkanMemoryAllocator.git "$sources/vma"
        cmake -S "$sources/vma" -B "$sources/vma-build" -G Ninja       -DCMAKE_INSTALL_PREFIX="$prefix" -DVMA_BUILD_SAMPLES=OFF
        cmake --install "$sources/vma-build"

        python3 - <<'PY'
        from pathlib import Path
        import os
        prefix = Path('.local-deps/root/usr').resolve()
        boost = list(prefix.glob('lib/cmake/Boost-*/BoostConfig.cmake'))
        if len(boost) != 1:
            raise SystemExit(f'Expected one installed BoostConfig.cmake, found {boost}')
        values = {'GOW3_ARM64_HEADERS': str(prefix), 'GOW3_BOOST_DIR': str(boost[0].parent)}
        headers = list(prefix.glob('lib/cmake/boost_headers-*/boost_headers-config.cmake'))
        if len(headers) == 1:
            values['GOW3_BOOST_HEADERS_DIR'] = str(headers[0].parent)
        with open(os.environ['GITHUB_ENV'], 'a') as env:
            for name, value in values.items():
                env.write(f'{name}={value}\n')
        print('Header package locations:', values)
        PY
    - name: Build Bionic dependencies
      run: |
        bash tools/android/build_bionic_deps.sh 2>&1 | tee out/phone-build/dependencies.log
    - name: Build the CPU and GPU runtime
      run: |
        bash tools/android/build_bionic.sh 2>&1 | tee out/phone-build/runtime-build.log
    - name: Build and verify the debug APK
      run: |
        bash tools/android/debug/build_bionic_debug_apk.sh 2>&1 | tee out/phone-build/apk-build.log
        python3 - <<'PY'
        from pathlib import Path
        import hashlib
        import shutil
        apks = list(Path('out/debug').glob('*.apk'))
        if len(apks) != 1:
            raise SystemExit(f'Expected exactly one newly built APK, found {apks}')
        output = Path('out/phone-build/apk/GOW3-startup-fix-debug.apk')
        output.parent.mkdir(parents=True, exist_ok=True)
        shutil.copy2(apks[0], output)
        digest = hashlib.sha256(output.read_bytes()).hexdigest()
        output.with_suffix('.apk.sha256').write_text(f'{digest}  {output.name}\n')
        print('Built:', output, 'SHA-256:', digest)
        PY
    - name: Save the APK and checksum
      uses: actions/upload-artifact@v7
      with:
        name: GOW3-startup-fix-debug-apk
        path: out/phone-build/apk/
        if-no-files-found: error
        retention-days: 7
    - name: Save diagnostics, including on failure
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: GOW3-phone-build-logs
        path: |
          out/phone-build/*.txt
          out/phone-build/*.log
          out/bionic/*-build.log
          .local-deps/android/bionic-build/*.log
        include-hidden-files: true
        if-no-files-found: warn
        retention-days: 7
